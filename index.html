<!DOCTYPE html>
<html>
<head>
    <title>Redirect</title>
</head>
<body>
    <script>
        const mappings = {
            "fm56": "https://example.com"
        };

        const path = window.location.pathname.substring(1);
        if (mappings[path]) {
            window.location.href = mappings[path];
        } else {
            document.body.innerHTML = "<h1>Invalid code</h1>";
        }
    </script>
</body>
</html>
