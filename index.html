<!DOCTYPE html>
<html>
<head>
    <title>Redirect</title>
</head>
<body>
    <script>
        const mappings = {
            "fm56": "https://example.com",
            "UniteMedia": "https://www.dropbox.com/request/rrgk7d4qd78zbgr3s63d"
        };

        const hash = window.location.hash.substring(1);
        if (mappings[hash]) {
            window.location.href = mappings[hash];
        } else {
            document.body.innerHTML = "<h1>Invalid code</h1>";
        }
    </script>
</body>
</html>
