
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redirect</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: grid;
            place-items: center;

            background: #f5f5f5;
            color: #737373;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        p {
            margin: 0;
            font-size: 14px;
        }

        @media (prefers-color-scheme: dark) {

            body {
                background: #111;
                color: #999;
            }

        }

    </style>
</head>

<body>

    <p id="status">
        Redirecting…
    </p>


    <script>

        let supabase;


        async function loadSupabaseConfig() {

            const response =
                await fetch("/redirect/SUPABASE.json");

            if (!response.ok) {
                throw new Error("Could not load SUPABASE.json");
            }

            supabase =
                await response.json();


            if (!supabase.url || !supabase.key) {
                throw new Error(
                    "SUPABASE.json is missing url or key."
                );
            }
        }


        async function redirect() {

            const status =
                document.getElementById("status");


            /*
                GitHub Pages sends requests such as:

                /redirect/UniteMedia

                to this 404 page.

                Remove /redirect/ and use
                everything remaining as the slug.
            */

            const basePath =
                "/redirect/";


            let slug =
                window.location.pathname;


            if (slug.startsWith(basePath)) {

                slug =
                    slug.substring(basePath.length);

            }


            // Remove trailing slashes.

            slug =
                slug.replace(/\/+$/, "");


            if (!slug) {

                status.textContent =
                    "Invalid redirect.";

                return;
            }


            try {

                slug =
                    decodeURIComponent(slug);

            } catch {

                status.textContent =
                    "Invalid redirect.";

                return;
            }


            try {

                await loadSupabaseConfig();


                const response =
                    await fetch(
                        `${supabase.url}/rest/v1/redirects?slug=eq.${encodeURIComponent(slug)}&select=url&limit=1`,
                        {
                            headers: {
                                "apikey": supabase.key,
                                "Authorization": `Bearer ${supabase.key}`
                            }
                        }
                    );


                if (!response.ok) {
                    throw new Error(
                        "Supabase request failed."
                    );
                }


                const rows =
                    await response.json();


                if (!rows.length || !rows[0].url) {

                    status.textContent =
                        "Invalid redirect.";

                    return;
                }


                window.location.replace(
                    rows[0].url
                );


            } catch (error) {

                console.error(error);

                status.textContent =
                    "Unable to look up redirect.";
            }

        }


        redirect();

    </script>

</body>
</html>
